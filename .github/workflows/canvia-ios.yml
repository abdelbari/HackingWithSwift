name: Canvia iOS

# This repository is public, so GitHub-hosted runners - macOS included - are
# free. Runs on the working branches and on demand.
on:
  push:
    branches: [ 'claude/**' ]
    paths: [ 'Canvia/**', '.github/workflows/canvia-ios.yml' ]
  workflow_dispatch:
    inputs:
      screenshot:
        description: "Boot a simulator, launch the app and capture a screenshot"
        type: boolean
        default: true

jobs:
  # Cheap Linux gate: syntax, argument labels, enum cases, switch
  # exhaustiveness, ViewBuilder limits. Fails fast before paying for macOS.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Static analysis
        working-directory: Canvia/Tools
        run: |
          npm install --no-audit --no-fund
          node verify.js ../Canvia ../Tests

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The project uses the Xcode 16 synchronized-folder format
      # (objectVersion 77), so an older Xcode cannot even open it.
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "using $NEWEST"
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version
          xcrun simctl list runtimes | head -20

      # The real compile. -target avoids needing a shared scheme; code
      # signing is off because we only ever run this in a simulator.
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Canvia/Canvia.xcodeproj \
            -target Canvia \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | tail -40

      - name: Summarise warnings
        if: always()
        run: |
          echo "### Build diagnostics" >> "$GITHUB_STEP_SUMMARY"
          grep -E 'warning:|error:' build.log | sort -u | head -50 >> "$GITHUB_STEP_SUMMARY" || echo "none" >> "$GITHUB_STEP_SUMMARY"
          echo "--- warnings ---"
          grep -E 'warning:' build.log | sort -u | head -60 || echo "(none)"

      - name: Launch in a simulator and screenshot
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.screenshot }}
        run: |
          set -e
          DEVICE=$(xcrun simctl create canvia-ci "iPhone 16" \
            $(xcrun simctl list runtimes | grep -o 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]*' | tail -1))
          echo "device: $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b

          APP=$(find build -name 'Canvia.app' -type d | head -1)
          echo "app: $APP"
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch --console-pty "$DEVICE" com.canvia.app &
          sleep 12
          xcrun simctl io "$DEVICE" screenshot home.png
          sips -Z 340 -s format jpeg -s formatOptions 70 home.png --out home-small.jpg >/dev/null

          # Echo the shot into the job log so it can be read back without
          # downloading the artifact.
          echo "===SHOT_START==="
          base64 -i home-small.jpg | fold -w 200
          echo "===SHOT_END==="

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canvia-build
          path: |
            build.log
            home.png
          if-no-files-found: warn
