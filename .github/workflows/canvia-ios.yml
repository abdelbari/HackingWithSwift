name: Canvia iOS

# This repository is public, so GitHub-hosted runners - macOS included - are
# free. Runs on the working branches and on demand.
on:
  push:
    branches: [ 'claude/**' ]
    paths: [ 'Canvia/**', '.github/workflows/canvia-ios.yml' ]
  workflow_dispatch:
    inputs:
      screenshot:
        description: "Boot a simulator, launch the app and capture a screenshot"
        type: boolean
        default: true

jobs:
  # Cheap Linux gate: syntax, argument labels, enum cases, switch
  # exhaustiveness, ViewBuilder limits. Fails fast before paying for macOS.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Static analysis
        working-directory: Canvia/Tools
        run: |
          npm install --no-audit --no-fund
          node verify.js ../Canvia ../Tests

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The project uses the Xcode 16 synchronized-folder format
      # (objectVersion 77), so an older Xcode cannot open it at all. Pin to
      # the newest 16.x, which is what the project documents as its target;
      # runners also carry 26.x, covered by the separate matrix job.
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          PICK=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$PICK" ] || PICK=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "using $PICK"
          sudo xcode-select -s "$PICK"
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios

      # The real compile. Code signing is off because this only ever runs in
      # a simulator. -derivedDataPath requires -scheme, hence the shared
      # scheme committed alongside the project.
      # Diagnostics go to stdout, not just the step summary: the job log is
      # the only channel readable without downloading the artifact.
      - name: Build for iOS Simulator
        run: |
          status=0
          xcodebuild \
            -project Canvia/Canvia.xcodeproj \
            -scheme Canvia \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1 || status=$?

          echo "===== ERRORS ====="
          grep -E '(error|fatal error):' build.log | sed 's#/Users/runner/work/HackingWithSwift/HackingWithSwift/##' \
            | sort -u | head -80 || true
          echo "===== NOTES ====="
          grep -E '^[^ ].*\.swift:[0-9]+:[0-9]+: note:' build.log | sed 's#/Users/runner/work/HackingWithSwift/HackingWithSwift/##' \
            | sort -u | head -30 || true
          echo "===== WARNINGS ====="
          grep -E 'warning:' build.log | grep -v 'Node.js\|deprecat' | sed 's#/Users/runner/work/HackingWithSwift/HackingWithSwift/##' \
            | sort -u | head -40 || true
          echo "===== TAIL ====="
          tail -25 build.log
          exit $status

      - name: Launch in a simulator and screenshot
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.screenshot) }}
        run: |
          set -e
          # Pair the simulator with the Xcode that built the app. The runner
          # also carries iOS 26 runtimes, which Xcode 16.4 cannot drive, so
          # taking the newest runtime outright would fail here.
          RUNTIMES=$(xcrun simctl list runtimes available)
          echo "$RUNTIMES"
          RUNTIME=$(grep -o 'com.apple.CoreSimulator.SimRuntime.iOS-18[0-9-]*' <<<"$RUNTIMES" | sort -V | tail -1)
          [ -n "$RUNTIME" ] || RUNTIME=$(grep -o 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]*' <<<"$RUNTIMES" | sort -V | tail -1)
          [ -n "$RUNTIME" ] || { echo "no usable iOS runtime"; exit 1; }
          echo "runtime: $RUNTIME"
          DEVICE=$(xcrun simctl create canvia-ci "iPhone 16" "$RUNTIME")
          echo "device: $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b

          APP=$(find build -name 'Canvia.app' -type d | head -1)
          echo "app: $APP"
          xcrun simctl install "$DEVICE" "$APP"

          # Launch in the foreground so a failed launch is a failed step. The
          # earlier `--console-pty ... &` form discarded both the exit status
          # and the message, and the screenshot then caught the springboard.
          xcrun simctl launch "$DEVICE" com.canvia.app
          sleep 20

          # A launch that succeeds and then crashes still leaves the
          # springboard on screen, so confirm the process is alive.
          if xcrun simctl spawn "$DEVICE" launchctl list | grep -q com.canvia.app; then
            echo "app is running"
          else
            echo "app is NOT running — it launched and exited"
            for report in $(ls -t ~/Library/Logs/DiagnosticReports/Canvia*.ips 2>/dev/null | head -2); do
              echo "===== $report ====="
              head -80 "$report"
            done
            xcrun simctl io "$DEVICE" screenshot home.png || true
            exit 1
          fi

          xcrun simctl io "$DEVICE" screenshot home.png
          # Keep the inline copy small: the job log is only readable from the
          # tail, so a large base64 block pushes its own header out of reach.
          sips -Z 230 -s format jpeg -s formatOptions 40 home.png --out home-small.jpg >/dev/null
          ls -l home-small.jpg

          # Echo the shot into the job log so it can be read back without
          # downloading the artifact (blob storage is not always reachable).
          echo "===SHOT_START==="
          base64 -i home-small.jpg | fold -w 200
          echo "===SHOT_END==="

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canvia-build
          path: |
            build.log
            home.png
          if-no-files-found: warn
