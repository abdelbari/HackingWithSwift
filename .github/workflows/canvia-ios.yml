name: Canvia iOS

# This repository is public, so GitHub-hosted runners - macOS included - are
# free. Runs on the working branches and on demand.
on:
  push:
    branches: [ 'claude/**' ]
    paths: [ 'Canvia/**', '.github/workflows/canvia-ios.yml' ]
  workflow_dispatch:
    inputs:
      screenshot:
        description: "Boot a simulator, launch the app and capture a screenshot"
        type: boolean
        default: true

jobs:
  # Cheap Linux gate: syntax, argument labels, enum cases, switch
  # exhaustiveness, ViewBuilder limits. Fails fast before paying for macOS.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Static analysis
        working-directory: Canvia/Tools
        run: |
          npm install --no-audit --no-fund
          node verify.js ../Canvia ../Tests

  # Two toolchains, because they test different things. The baseline leg
  # proves the iOS 17 deployment target still builds and runs on the older
  # SDK; the latest leg builds against the newest SDK Apple ships, which is
  # where new deprecations and stricter diagnostics show up first.
  #
  # Versions here are not guesses - .github/workflows/canvia-probe.yml
  # reports what each runner image actually carries. As of 2026-09-01:
  #   macos-15: Xcode 16.0-16.4 + 26.0-26.3, runtimes iOS 18.5, 18.6, 26.0-26.2
  #   macos-26: Xcode up to 26.6 (SDK iOS 26.5), runtimes iOS 26.2, 26.4, 26.5
  # iOS 26.6 ships on devices, but there is no iOS 26.6 SDK or simulator
  # runtime - Xcode 26.6 carries the iOS 26.5 SDK, and Apple's runtime catalog
  # goes 26.5 then straight to 27.0. So 26.5 is the newest testable iOS here,
  # and a phone on 26.6.x is only reachable through a real-device install.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline-ios18
            runner: macos-15
            xcode: /Applications/Xcode_16.4.0.app
            ios: '18.6'
            device: iPhone 16
          - name: latest-ios26
            runner: macos-26
            xcode: /Applications/Xcode_26.6.0.app
            ios: '26.5'
            device: iPhone 17 Pro
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ matrix.xcode }}
        run: |
          if [ ! -d "${{ matrix.xcode }}" ]; then
            echo "::error::${{ matrix.xcode }} is not installed on this runner."
            ls -d /Applications/Xcode*.app 2>/dev/null | sort -V
            exit 1
          fi
          sudo xcode-select -s "${{ matrix.xcode }}"
          xcodebuild -version
          xcrun simctl list runtimes | grep -i '^iOS' || true

      # Fail loudly when the requested runtime is absent rather than letting
      # xcodebuild silently pick a different one - a green run against the
      # wrong OS is worse than a red one.
      - name: Require iOS ${{ matrix.ios }} runtime
        run: |
          if ! xcrun simctl list runtimes available | grep -q "iOS ${{ matrix.ios }} "; then
            echo "::error::iOS ${{ matrix.ios }} runtime is not available on this runner."
            xcrun simctl list runtimes available
            exit 1
          fi
          echo "iOS ${{ matrix.ios }} is available"

      # The real compile, plus XCTest. `test` rather than `build`, so the 17
      # geometry assertions in Canvia/Tests actually execute on each iOS
      # version instead of the run only proving the app links and launches.
      # Code signing is off because this only ever runs in a simulator.
      # -derivedDataPath requires -scheme, hence the shared scheme committed
      # alongside the project.
      # Diagnostics go to stdout, not just the step summary: the job log is
      # the only channel readable without downloading the artifact.
      - name: Build and test on iOS ${{ matrix.ios }}
        run: |
          status=0
          xcodebuild \
            -project Canvia/Canvia.xcodeproj \
            -scheme Canvia \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=${{ matrix.device }},OS=${{ matrix.ios }}' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            test > build.log 2>&1 || status=$?

          # Kept in a file as well: simctl bootstatus in the next step emits
          # a hundred lines of migration chatter, which pushes this out of
          # the readable tail of the job log.
          { grep -E "^Test Suite .*(passed|failed)" build.log | sort -u | head -20 \
              || echo "(no test results - did the build fail before tests ran?)"
            grep -E "Executed [0-9]+ test" build.log | sort -u | head -5 || true
          } > tests.txt
          # Kept in a file for the same reason as the test summary: the
          # screenshot step and the artifact upload push several hundred lines
          # between this step and the end of the job, and the job log is only
          # readable from its tail.
          grep -E '(error|fatal error):' build.log \
            | sed 's#/Users/runner/work/HackingWithSwift/HackingWithSwift/##' \
            | sort -u | head -40 > errors.txt || true
          echo "===== TESTS ====="
          cat tests.txt
          echo "===== ERRORS ====="
          grep -E '(error|fatal error):' build.log | sed 's#/Users/runner/work/HackingWithSwift/HackingWithSwift/##' \
            | sort -u | head -80 || true
          echo "===== NOTES ====="
          grep -E '^[^ ].*\.swift:[0-9]+:[0-9]+: note:' build.log | sed 's#/Users/runner/work/HackingWithSwift/HackingWithSwift/##' \
            | sort -u | head -30 || true
          echo "===== WARNINGS ====="
          grep -E 'warning:' build.log | grep -v 'Node.js\|deprecat' | sed 's#/Users/runner/work/HackingWithSwift/HackingWithSwift/##' \
            | sort -u | head -40 || true
          echo "===== TAIL ====="
          tail -25 build.log
          exit $status

      - name: Launch on iOS ${{ matrix.ios }} and screenshot
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.screenshot) }}
        run: |
          set -e
          RUNTIME=$(xcrun simctl list runtimes available \
            | grep "iOS ${{ matrix.ios }} " \
            | grep -o 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]*' | head -1)
          [ -n "$RUNTIME" ] || { echo "iOS ${{ matrix.ios }} runtime vanished"; exit 1; }
          echo "runtime: $RUNTIME"
          DEVICE=$(xcrun simctl create canvia-ci "${{ matrix.device }}" "$RUNTIME")
          echo "device: $DEVICE (${{ matrix.device }})"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b > /dev/null

          APP=$(find build -name 'Canvia.app' -type d | head -1)
          echo "app: $APP"
          xcrun simctl install "$DEVICE" "$APP"

          # Launch in the foreground so a failed launch is a failed step. The
          # earlier `--console-pty ... &` form discarded both the exit status
          # and the message, and the screenshot then caught the springboard.
          xcrun simctl launch "$DEVICE" com.canvia.app
          sleep 20

          # A launch that succeeds and then crashes still leaves the
          # springboard on screen, so confirm the process is alive.
          if xcrun simctl spawn "$DEVICE" launchctl list | grep -q com.canvia.app; then
            echo "app is running on iOS ${{ matrix.ios }}"
          else
            echo "app is NOT running — it launched and exited"
            for report in $(ls -t ~/Library/Logs/DiagnosticReports/Canvia*.ips 2>/dev/null | head -2); do
              echo "===== $report ====="
              head -80 "$report"
            done
            xcrun simctl io "$DEVICE" screenshot home.png || true
            exit 1
          fi

          # Three shots, because the two things hardest to review from source
          # are how a screen is composed and whether dark mode holds up. The
          # editor one needs the app opened onto a design: -canviaOpenTemplate
          # is a DEBUG-only launch argument that does exactly that (see
          # CanviaApp), so the tour needs no UI-test target.
          shoot() {   # shoot <name>
            xcrun simctl io "$DEVICE" screenshot "$1.png"
            sips -Z 380 -s format jpeg -s formatOptions 40 "$1.png" \
              --out "$1-small.jpg" >/dev/null
          }

          shoot home-light

          xcrun simctl ui "$DEVICE" appearance dark
          sleep 3
          shoot home-dark
          xcrun simctl ui "$DEVICE" appearance light

          xcrun simctl terminate "$DEVICE" com.canvia.app || true
          xcrun simctl launch "$DEVICE" com.canvia.app -canviaOpenTemplate 0
          sleep 12
          shoot editor-light

          ls -l *-small.jpg

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canvia-${{ matrix.name }}
          path: |
            build.log
            home-light.png
            home-dark.png
            editor-light.png
          if-no-files-found: warn

      # Last step on purpose. The job log is only readable from the tail, so
      # emitting the image anywhere earlier lets a long build transcript push
      # the block's own header out of reach. Artifact blob storage is not
      # reachable from every environment, so the log is the fallback channel.
      - name: Echo the test results and screenshot into the log
        if: always()
        run: |
          echo "===== TESTS (${{ matrix.name }}, iOS ${{ matrix.ios }}) ====="
          cat tests.txt 2>/dev/null || echo "(no test summary captured)"
          if [ -s errors.txt ]; then
            echo "===== ERRORS (${{ matrix.name }}) ====="
            cat errors.txt
          fi
          for shot in home-light home-dark editor-light; do
            [ -f "$shot-small.jpg" ] || continue
            echo "===SHOT_START=== $shot ${{ matrix.name }} iOS ${{ matrix.ios }} ${{ matrix.device }}"
            base64 -i "$shot-small.jpg" | fold -w 200
            echo "===SHOT_END==="
          done
