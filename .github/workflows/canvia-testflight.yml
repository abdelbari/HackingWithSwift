name: Canvia TestFlight

# Builds a signed release of Canvia and uploads it to TestFlight, so it can be
# installed on a real iPhone from the TestFlight app.
#
# Deliberately manual (and tag-triggered) rather than running on every push:
# each upload consumes a build number in App Store Connect, and duplicates are
# rejected outright.
#
# Signing uses Xcode's own automatic provisioning driven by an App Store
# Connect API key (-allowProvisioningUpdates plus the -authenticationKey*
# flags). That means no certificate wrangling, no .p12 to export, and no
# temporary keychain: Xcode creates and renews the distribution certificate
# and provisioning profile itself. See Canvia/README.md for how to mint the
# key and which secrets to set.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What to tell testers about this build"
        type: string
        default: "Automated build from CI"
  push:
    tags: [ 'v*' ]

jobs:
  testflight:
    runs-on: macos-26
    env:
      # Override in repo Settings -> Variables if com.canvia.app is not
      # available to your team; the App ID is registered under whatever this
      # says the first time automatic signing runs.
      BUNDLE_ID: ${{ vars.CANVIA_BUNDLE_ID || 'com.canvia.app' }}
    steps:
      - uses: actions/checkout@v4

      # Fail with an actionable message rather than an opaque codesign error
      # forty lines into an archive.
      - name: Check required secrets
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          [ -n "$KEY_ID" ]      || missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -n "$ISSUER_ID" ]   || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$PRIVATE_KEY" ] || missing="$missing APP_STORE_CONNECT_PRIVATE_KEY"
          [ -n "$TEAM_ID" ]     || missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "See Canvia/README.md, section 'Installing on your own iPhone',"
            echo "for how to create an App Store Connect API key and set these."
            exit 1
          fi
          echo "all four secrets are present"

      - name: Select Xcode
        run: |
          PICK=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$PICK" ] || PICK=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$PICK"
          xcodebuild -version

      # xcodebuild looks for the key by name in ./private_keys, ~/private_keys
      # or ~/.appstoreconnect/private_keys - the filename must be exactly
      # AuthKey_<KEY_ID>.p8.
      - name: Install the App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$PRIVATE_KEY" > ~/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${KEY_ID}.p8
          # Confirm shape without ever printing the key itself.
          head -1 ~/private_keys/AuthKey_${KEY_ID}.p8 | grep -q 'BEGIN PRIVATE KEY' \
            || { echo "::error::APP_STORE_CONNECT_PRIVATE_KEY does not look like a .p8 file. Paste the whole file, BEGIN/END lines included."; exit 1; }
          echo "key installed as AuthKey_${KEY_ID}.p8"

      # App Store Connect rejects a build number it has already seen, so it has
      # to increase on every upload. The run number does that for free.
      - name: Archive
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Canvia/Canvia.xcodeproj \
            -scheme Canvia \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Canvia.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            2>&1 | tee archive.log | tail -40 || status=$?
          echo "===== ERRORS ====="
          grep -E '(error|fatal error):' archive.log | sort -u | head -40 || true
          exit ${status:-0}

      - name: Write ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # 'app-store-connect' is the current name for what older Xcode called
          # 'app-store'. 'destination: upload' makes -exportArchive deliver the
          # build straight to App Store Connect, so no separate altool step.
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          cat ExportOptions.plist

      - name: Export and upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/Canvia.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | tee export.log | tail -40 || status=$?
          echo "===== ERRORS ====="
          grep -E '(error|fatal error):' export.log | sort -u | head -40 || true
          exit ${status:-0}

      - name: Summary
        if: success()
        run: |
          echo "Uploaded build ${{ github.run_number }} of $BUNDLE_ID to App Store Connect."
          echo "It appears in TestFlight after Apple finishes processing (usually 5-15 minutes)."
          echo "Notes for testers: ${{ inputs.notes }}"

      - name: Remove the signing key
        if: always()
        run: rm -f ~/private_keys/AuthKey_*.p8

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canvia-testflight-logs
          path: |
            archive.log
            export.log
          if-no-files-found: warn
